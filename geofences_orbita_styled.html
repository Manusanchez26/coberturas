    align-items: center;

    color: #fff;
    border-color: #4D2AAD;

    font-style: italic;

    padding: 3px 10px;
    border-radius: 9999px;

  .o-legend {

    flex-wrap: wrap;
    gap: 8px;
    background: #fff;
    border-top: 1px solid #E1E1E1;

  let map, layers = [], city = 'medellin', vehicle = 'small';

  function parsePoly(pts) { const r = []; for (let i = 0; i < pts.length; i += 2)r.push([pts[i], pts[i + 1]]); return r; }

  function render() {
    layers.forEach(l => map.removeLayer(l));
    layers = [];
    const zones = GEO[city][vehicle];
    zones.forEach(z => {
      const poly = L.polygon(parsePoly(z.points), { color: z.color, fillColor: z.color, fillOpacity: 0.32, weight: 2.5, opacity: 0.9 }).addTo(map);
      poly.bindTooltip(`<span style="font-family:'Sora',sans-serif;font-size:11px;font-weight:600;color:#111">${z.name}</span>`, { sticky: true, className: 'orbita-tip' });
      layers.push(poly);
    });
    document.getElementById('zone-badge').textContent = `${zones.length} zonas`;
    const leg = document.getElementById('legend');
    leg.innerHTML = zones.map(z => `<div class="o-chip"><span class="o-chip-dot" style="background:${z.color}"></span>${z.name}</div>`).join('');
    setTimeout(() => { if (layers.length) map.fitBounds(L.featureGroup(layers).getBounds(), { padding: [20, 20] }); }, 100);
  }

  function updateBtns() {
    const a = 'o-btn active', i = 'o-btn';
    document.getElementById('btn-mde').className = city === 'medellin' ? a : i;
    document.getElementById('btn-bog').className = city === 'bogota' ? a : i;
    document.getElementById('btn-moto').className = vehicle === 'small' ? a : i;
    document.getElementById('btn-van').className = vehicle === 'big' ? a : i;
  }

  function setCity(c) { city = c; updateBtns(); render(); }
  function setVehicle(v) { vehicle = v; updateBtns(); render(); }
  window.setCity = setCity; window.setVehicle = setVehicle;

  window.addEventListener('load', () => {
    map = L.map('map', { zoomControl: true, attributionControl: false }).setView([6.25, -75.58], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    updateBtns();
    render();
  });
